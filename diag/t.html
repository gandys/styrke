<!DOCTYPE html><meta charset="utf-8"><pre id="out">running</pre>
<script>
(async () => {
  const tok = location.hash.slice(1);
  const base = 'https://api.github.com/repos/gandys/styrke';
  const full = { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  const cases = [
    ['A app-as-shipped: trailing slash + version header + no-store', base + '/', { cache: 'no-store', headers: full }],
    ['B no trailing slash + version header + no-store', base, { cache: 'no-store', headers: full }],
    ['C no trailing slash + version header, default cache', base, { headers: full }],
    ['D no trailing slash, auth+accept only, no-store', base, { cache: 'no-store', headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' } }],
    ['E contents file + version header + no-store', base + '/contents/README.md', { cache: 'no-store', headers: full }],
    ['F contents missing file (404 expected)', base + '/contents/nope.json', { cache: 'no-store', headers: full }],
    ['G contents with cache-buster query', base + '/contents/README.md?_=' + Date.now(), { headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' } }],
    ['H trailing slash, no auth, simple request', base + '/', {}],
  ];
  const lines = [];
  for (const [name, url, opts] of cases) {
    try { const r = await fetch(url, opts); lines.push(`${name} => HTTP ${r.status} redirected=${r.redirected} url=${r.url.replace(/\?.*/, '')}`); }
    catch (e) { lines.push(`${name} => THROWS ${e.name}: ${e.message}`); }
  }
  document.getElementById('out').textContent = 'RESULTS\n' + lines.join('\n') + '\nEND';
})();
</script>
