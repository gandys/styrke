name: Build Styrke

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug -Pvc=${{ github.run_number }}
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Styrke.apk
      - uses: actions/upload-artifact@v4
        with: { name: Styrke-apk, path: Styrke.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/web, if-no-files-found: error }
      - name: Publish release (stable download link for the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Styrke.apk \
            --title "Styrke 1.0.${{ github.run_number }}" \
            --notes "Install by opening Styrke.apk on your phone. It updates the installed app in place; your data stays." \
            --latest

  web:
    name: Web app (GitHub Pages)
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true   # needs Pages switched on once: Settings > Pages > Source: GitHub Actions
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web, path: site }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
