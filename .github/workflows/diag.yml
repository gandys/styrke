name: Diagnose GitHub API from a browser
on:
  push:
    branches: [diag]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Preflight headers
        run: |
          curl -sS -o /dev/null -D - -X OPTIONS -H "Origin: https://appassets.androidplatform.net" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,x-github-api-version" https://api.github.com/repos/gandys/styrke | grep -i -E '^(HTTP|access-control|location)'
          echo "--- trailing slash"
          curl -sS -o /dev/null -D - -H "Origin: https://appassets.androidplatform.net" https://api.github.com/repos/gandys/styrke/ | grep -i -E '^(HTTP|access-control|location)'
      - name: Real Chrome fetches
        env:
          TOK: ${{ github.token }}
        run: |
          google-chrome --version
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom "file://$PWD/diag/t.html#$TOK" | sed -n '/RESULTS/,/END/p'
